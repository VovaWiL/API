<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | TIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container-box {
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;
            text-align: center;
        }

        .input-field {
            background-color: #222222;
            border: 1px solid #333333;
            color: #ffffff;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #007aff;
            outline: none;
        }

        .btn-primary {
            background-color: #007aff;
            color: #ffffff;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #005bbd;
        }

        .btn-social {
            background: transparent;
            border: 1px solid #333333;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-social:hover {
            background-color: #1a1a1a;
            border-color: #555555;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #555555;
            font-size: 12px;
            margin: 24px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333333;
        }

        .divider:not(:empty)::before { margin-right: 12px; }
        .divider:not(:empty)::after { margin-left: 12px; }

        .step-content {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden-step {
            display: none !important;
            opacity: 0;
            transform: translateY(10px);
        }

        .robot-tile {
            aspect-ratio: 1;
            background: #222222;
            border: 1px solid #333333;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }

        .robot-tile.selected {
            background: #007aff;
            border-color: #007aff;
            color: white;
        }

        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007aff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
        }
        #error-modal.visible { visibility: visible; }
    </style>
</head>
<body>

    <div class="container-box">
        <!-- Logo -->
        <div class="mt-4 mb-8 flex justify-center items-center">
            <span class="text-4xl font-extrabold tracking-tight text-white uppercase">TIMATE</span>
        </div>

        <!-- Step 1: Sign In -->
        <div id="step-1" class="step-content">
            <h1 class="text-3xl font-bold mb-1 text-white">Sign in</h1>
            <p class="text-gray-400 text-sm mb-8">to continue to Timate</p>

            <div class="space-y-4">
                <input type="email" id="email-input" placeholder="Email" class="input-field w-full py-3 px-4 rounded-lg text-sm">
                
                <button id="btn-email-continue" class="btn-primary w-full py-3 rounded-lg text-sm mb-4">
                    Continue
                </button>

                <p class="text-sm text-gray-400">
                    New to Timate? <a href="#" class="text-blue-500 hover:underline">Create an account</a>
                </p>

                <div class="divider">or</div>

                <button id="btn-google" class="btn-social w-full py-3 px-4 rounded-full">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9105 17.5885 17.1582 16.3214 17.9739V20.9598H20.19C22.4603 18.8813 23.766 15.8544 23.766 12.2764Z" fill="#4285F4"/>
                        <path d="M12.24 24C15.4834 24 18.2159 22.9269 20.1945 21.0601L16.3259 18.0742C15.2451 18.8023 13.864 19.245 12.2445 19.245C9.11242 19.245 6.45946 17.1359 5.50797 14.307H1.51318V17.3912C3.55371 21.4434 7.7029 24 12.24 24Z" fill="#34A853"/>
                        <path d="M5.50348 14.307C5.00021 12.8099 5.00021 11.1961 5.50348 9.69904V6.61481H1.51318C-0.189307 10.0053 -0.189307 13.9947 1.51318 17.3852L5.50348 14.307Z" fill="#FBBC05"/>
                        <path d="M12.24 4.75502C13.9576 4.73031 15.6145 5.37893 16.8533 6.56605L20.2695 3.14984C18.1035 1.12311 15.2244 -0.00315429 12.24 3.7651e-05C7.7029 3.7651e-05 3.55371 2.5566 1.51318 6.60882L5.50348 9.69305C6.45047 6.86411 9.10344 4.75502 12.24 4.75502Z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>

                <button id="btn-github" class="btn-social w-full py-3 px-4 rounded-full">
                    <i class="fab fa-github text-lg"></i>
                    Continue with GitHub
                </button>
            </div>
        </div>

        <!-- Step 2: Captcha -->
        <div id="step-2" class="step-content hidden-step">
            <h2 class="text-2xl font-bold mb-2">Security Check</h2>
            <p class="text-gray-400 text-sm mb-6 px-8">Выберите всё, что связано с <span class="text-white font-bold">электроникой</span></p>
            <div class="grid grid-cols-3 gap-2 mb-8">
                <div id="robot-grid" class="contents"></div>
            </div>
            <button id="verify-btn" class="btn-primary w-full py-3 rounded-lg text-sm">Verify</button>
            <button id="btn-cancel" class="mt-4 text-xs text-gray-500 hover:text-white transition-colors">Cancel</button>
        </div>

        <!-- Step 3: Loading -->
        <div id="step-loading" class="step-content hidden-step">
            <div class="flex flex-col items-center justify-center py-12">
                <div class="loader mb-4" style="width: 40px; height: 40px;"></div>
                <h2 class="text-xl font-bold mb-2">Authenticating...</h2>
                <p class="text-gray-400 text-sm">Synchronizing your credentials with Timate</p>
            </div>
        </div>

        <!-- Step 4: Success -->
        <div id="step-3" class="step-content hidden-step">
            <div class="mb-6">
                <i class="fas fa-check-circle text-6xl text-green-500"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-white">Success!</h2>
            <p class="text-gray-400 text-sm mb-2">Welcome back!</p>
            <p id="user-info" class="text-white font-medium mb-8 text-xs break-all px-4"></p>
            <button onclick="location.reload()" class="btn-primary w-full py-3 rounded-lg text-sm">
                Go to Dashboard
            </button>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="error-modal">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl max-w-sm text-center">
            <i class="fas fa-exclamation-triangle text-amber-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Domain Error</h3>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed" id="error-text">
                This domain is not authorized in your Firebase project.
            </p>
            <button onclick="document.getElementById('error-modal').classList.remove('visible')" class="bg-zinc-800 hover:bg-zinc-700 text-white px-6 py-2 rounded-lg text-sm transition-all">
                Dismiss
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, GithubAuthProvider, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let loginMethod = "";

        // UI Helpers
        const switchStep = (from, to) => {
            document.getElementById(from).classList.add('hidden-step');
            setTimeout(() => {
                document.getElementById(to).classList.remove('hidden-step');
            }, 300);
        };

        const showError = (msg) => {
            const domain = window.location.hostname;
            document.getElementById('error-text').innerHTML = `
                ${msg}<br><br>
                <span class="text-xs text-zinc-500">Add <b>${domain}</b> to Authorized Domains in Firebase Authentication -> Settings.</span>
            `;
            document.getElementById('error-modal').classList.add('visible');
            const active = document.querySelector('.step-content:not(.hidden-step)');
            if(active && active.id === 'step-loading') switchStep('step-loading', 'step-1');
        };

        // Sync to Database
        async function recordUserLogin(user) {
            if (!user) return;
            try {
                const path = `artifacts/${appId}/users/${user.uid}/profile`;
                await setDoc(doc(db, path), {
                    uid: user.uid,
                    email: user.email || "anonymous",
                    displayName: user.displayName || "Timate User",
                    method: loginMethod,
                    timestamp: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.warn("Firestore sync skipped or failed (check permissions)");
            }
        }

        function finishLogin(user) {
            document.getElementById('user-info').innerText = user.email || user.displayName || user.uid;
            const active = document.querySelector('.step-content:not(.hidden-step)');
            switchStep(active.id, 'step-3');
        }

        // --- AUTH LOGIC ---

        document.getElementById('btn-google').onclick = async () => {
            loginMethod = "Google";
            switchStep('step-1', 'step-loading');
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                await recordUserLogin(result.user);
                finishLogin(result.user);
            } catch (err) {
                console.error(err);
                if(err.code === 'auth/unauthorized-domain') {
                    showError("This domain is not authorized.");
                } else {
                    switchStep('step-loading', 'step-1');
                }
            }
        };

        document.getElementById('btn-github').onclick = async () => {
            loginMethod = "GitHub";
            switchStep('step-1', 'step-loading');
            try {
                const result = await signInWithPopup(auth, new GithubAuthProvider());
                await recordUserLogin(result.user);
                finishLogin(result.user);
            } catch (err) {
                console.error(err);
                if(err.code === 'auth/unauthorized-domain') {
                    showError("This domain is not authorized.");
                } else {
                    switchStep('step-loading', 'step-1');
                }
            }
        };

        document.getElementById('btn-email-continue').onclick = () => {
            const email = document.getElementById('email-input').value;
            if(!email || !email.includes('@')) return;
            loginMethod = "Email";
            switchStep('step-1', 'step-2');
            initCaptcha();
        };

        // --- CAPTCHA ---
        const captchaIcons = [
            { id: 1, icon: 'fa-laptop', isEle: true }, { id: 2, icon: 'fa-leaf', isEle: false },
            { id: 3, icon: 'fa-mobile-screen', isEle: true }, { id: 4, icon: 'fa-cloud', isEle: false },
            { id: 5, icon: 'fa-microchip', isEle: true }, { id: 6, icon: 'fa-mug-hot', isEle: false },
            { id: 7, icon: 'fa-camera', isEle: true }, { id: 8, icon: 'fa-tree', isEle: false },
            { id: 9, icon: 'fa-headphones', isEle: true }
        ];

        function initCaptcha() {
            const grid = document.getElementById('robot-grid');
            grid.innerHTML = '';
            [...captchaIcons].sort(() => Math.random() - 0.5).forEach(item => {
                const tile = document.createElement('div');
                tile.className = 'robot-tile';
                tile.innerHTML = `<i class="fas ${item.icon}"></i>`;
                tile.dataset.ele = item.isEle;
                tile.onclick = () => tile.classList.toggle('selected');
                grid.appendChild(tile);
            });
        }

        document.getElementById('verify-btn').onclick = async () => {
            const tiles = document.querySelectorAll('.robot-tile');
            let valid = true;
            let count = 0;
            tiles.forEach(t => {
                const sel = t.classList.contains('selected');
                const ele = t.dataset.ele === 'true';
                if (sel) count++;
                if (sel !== ele) valid = false;
            });

            if (valid && count > 0) {
                switchStep('step-2', 'step-loading');
                try {
                    const res = await signInAnonymously(auth);
                    await recordUserLogin(res.user);
                    finishLogin({ email: document.getElementById('email-input').value });
                } catch (e) { 
                    console.error(e); 
                    showError("Auth failed.");
                }
            } else {
                initCaptcha();
            }
        };

        document.getElementById('btn-cancel').onclick = () => switchStep('step-2', 'step-1');
        
        // Initial token auth if available
        const initTokenAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            }
        };
        initTokenAuth();
    </script>
</body>
</html>
